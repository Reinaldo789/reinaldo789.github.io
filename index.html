<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guia Técnico - Montadoras</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout-wrapper">
    
    <!-- Botão Hambúrguer (Visível apenas no Celular) -->
    <button id="mobile-menu-btn" class="mobile-toggle" aria-label="Abrir menu">
      ☰ Menu
    </button>

    <!-- Fundo escuro ao abrir menu no celular -->
    <div id="sidebar-overlay" class="overlay"></div>

    <!-- Card Lateral Retrátil -->
    <aside id="sidebar" class="sidebar-card">
      
      <!-- Botão circular de recolher/expandir na borda (Desktop) -->
      <button id="toggle-btn" class="collapse-btn" title="Recolher/Expandir menu">
        <span id="toggle-icon">‹</span>
      </button>

      <!-- Cabeçalho do Card -->
      <div class="sidebar-header">
        <div class="brand-logo">GT</div>
        <span class="brand-title">Guia Técnico</span>
      </div>

      <!-- Lista Rolável de Montadoras -->
      <nav class="menu-list" id="montadoras-list">
        <!-- Preenchido dinamicamente pelo script.js ou dados -->
      </nav>

      <!-- Rodapé Fixo com Botão de Tema -->
      <div class="sidebar-footer">
        <button id="theme-toggle" class="menu-item theme-btn" type="button" title="Alternar Tema">
          <span class="icon" id="theme-icon">🌙</span>
          <span class="label" id="theme-label">Modo Escuro</span>
        </button>
      </div>

    </aside>

    <!-- Área Principal de Conteúdo (Cards das Montadoras e Fichas) -->
    <main class="main-content" id="conteudo-principal">
      <div class="secao-header">
        <h2><i class="fa-solid fa-flag" style="color: var(--active-text);"></i> Montadoras</h2>
        <p>Selecione uma montadora abaixo ou no menu lateral para consultar os modelos, fluidos e filtros.</p>
      </div>
      
      <!-- Grid de Cards de Montadoras na Tela Inicial -->
      <div id="grid-montadoras-home" class="modelos-grid" style="margin-top: 20px;">
        <!-- Os cards das montadoras aparecem aqui automaticamente -->
      </div>
    </main>

  </div>

  <script src="dados.js"></script>
  <script src="app.js"></script>
  <script src="script.js"></script>
</body>
</html>
